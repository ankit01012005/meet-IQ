services:
  - type: web
    name: meet-app
    runtime: node
    buildCommand: npm ci --prefix backend && npm ci --prefix frontend/meet && npm run build --prefix frontend/meet
    startCommand: npm ci --prefix backend && node index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DB_URL
        generateValue: false
